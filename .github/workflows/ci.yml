name: CI

on:
  push:
    branches: [main]
  pull_request:

# Manuell auch ausloesbar
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-Check + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Type-Check
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        run: npm run build
        env:
          # Dummy-Werte fuer den Build — Next.js validiert sie nur lexikalisch
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
